spring.application.name=plataformaReservaSaloes

spring.datasource.url=jdbc:postgresql://localhost:5432/reserva_saloes_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=9090

# Configuracao do Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.auto-commit=false

springdoc.show-login-endpoint=false

# Tamanho maximo de upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${java.io.tmpdir}

# Configuracao para evitar erro de serializacao Jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Desabilitar serializacao de lazy loading
spring.jpa.open-in-view=false
